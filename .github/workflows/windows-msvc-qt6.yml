name: Windows Neo

on:
  push:
    branches:
      - master
      - modern-ui
  pull_request:
    branches:
      - master
      - modern-ui
  workflow_dispatch:

env:
  QT_VERSION: "6.8"
  QT_ARCH: "win64_msvc2022_64"
  VCPKG_DEFAULT_TRIPLET: x64-windows
  BUILD_TYPE: Release

permissions: read-all

jobs:
  build-documentation:
    uses: ./.github/workflows/documentation-build.yml

  build:
    needs: build-documentation
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: >-
            qtconnectivity
            qtlocation
            qtpositioning
            qt5compat
            qtshadertools
            qtwebchannel
            qtwebengine
          cache: true

      - name: Set vcpkg environment
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\vcpkg-cache" >> $env:GITHUB_ENV

      - name: Create vcpkg cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg-cache"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('.github/workflows/windows-msvc-qt6.yml') }}
          restore-keys: windows-vcpkg-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install `
            libxml2 libxslt libzip sqlite3 libgit2 libssh2 `
            curl[ssl] openssl libusb hidapi libraw `
            --triplet x64-windows

      - name: Save vcpkg cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('.github/workflows/windows-msvc-qt6.yml') }}

      - name: load the documentation from cache
        uses: actions/cache@v6
        with:
          path: Documentation/output
          key: ${{ needs.build-documentation.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate libdivecomputer headers
        shell: pwsh
        working-directory: libdivecomputer
        run: |
          $configureAc = Get-Content "configure.ac" -Raw
          if ($configureAc -match 'm4_define\(\[dc_version_major\],\[(\d+)\]\)') { $major = $matches[1] } else { $major = "0" }
          if ($configureAc -match 'm4_define\(\[dc_version_minor\],\[(\d+)\]\)') { $minor = $matches[1] } else { $minor = "0" }
          if ($configureAc -match 'm4_define\(\[dc_version_micro\],\[(\d+)\]\)') { $micro = $matches[1] } else { $micro = "0" }
          if ($configureAc -match 'm4_define\(\[dc_version_suffix\],\[([^\]]*)\]\)') { $version = "$major.$minor.$micro-$($matches[1])" } else { $version = "$major.$minor.$micro" }
          $versionH = Get-Content "include/libdivecomputer/version.h.in" -Raw
          $versionH = $versionH -replace '@DC_VERSION@', $version
          $versionH = $versionH -replace '@DC_VERSION_MAJOR@', $major
          $versionH = $versionH -replace '@DC_VERSION_MINOR@', $minor
          $versionH = $versionH -replace '@DC_VERSION_MICRO@', $micro
          $versionH | Out-File -FilePath "include/libdivecomputer/version.h" -Encoding utf8
          $revision = git rev-parse --verify HEAD
          "#define DC_VERSION_REVISION `"$revision`"" | Out-File -FilePath "src/revision.h" -Encoding utf8

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build libdivecomputer with MSVC
        shell: pwsh
        run: |
          $installPrefix = "${{ github.workspace }}\install"
          $vcpkgInclude = "${{ env.VCPKG_ROOT }}\installed\x64-windows\include"
          $vcpkgLib = "${{ env.VCPKG_ROOT }}\installed\x64-windows\lib"
          $env:INCLUDE = "$vcpkgInclude;$env:INCLUDE"
          $env:LIB = "$vcpkgLib;$env:LIB"
          $env:CL = "/WX- /wd4996 /D_CRT_NONSTDC_NO_WARNINGS /D_CRT_SECURE_NO_WARNINGS"
          msbuild -m -p:Platform=x64 -p:Configuration=${{ env.BUILD_TYPE }} libdivecomputer/contrib/msvc/libdivecomputer.vcxproj
          $outputDir = "libdivecomputer/contrib/msvc/x64/${{ env.BUILD_TYPE }}/bin"
          New-Item -ItemType Directory -Force -Path "$installPrefix/bin","$installPrefix/lib","$installPrefix/include/libdivecomputer"
          Copy-Item "$outputDir/*.dll" -Destination "$installPrefix/bin" -ErrorAction SilentlyContinue
          Copy-Item "$outputDir/*.lib" -Destination "$installPrefix/lib" -ErrorAction SilentlyContinue
          Copy-Item "libdivecomputer/include/libdivecomputer/*" -Destination "$installPrefix/include/libdivecomputer" -Recurse

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Neo mobile UI dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $installPrefix = "${{ github.workspace }}\install"
          $thirdParty = "${{ github.workspace }}\mobile-widgets\3rdparty"
          $ecmSource = Join-Path $thirdParty "extra-cmake-modules"
          $ecmBuild = Join-Path $thirdParty "ECM"
          $breezeSource = Join-Path $thirdParty "breeze-icons"
          $kirigamiSource = Join-Path $thirdParty "kirigami"
          $kirigamiBuild = "${{ github.workspace }}\kirigami-build"

          git clone --branch v6.23.0 --depth 1 https://github.com/KDE/extra-cmake-modules.git $ecmSource
          cmake -S $ecmSource -B $ecmBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_INSTALL_PREFIX="$installPrefix" `
            -DBUILD_TESTING=OFF `
            -DBUILD_DOC=OFF
          cmake --build $ecmBuild --target install
          $breezeVersion = (Get-Content "scripts/get-dep-lib.sh" | Select-String 'CURRENT_BREEZE_ICONS="(.+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path $breezeSource | Out-Null
          git -C $breezeSource init
          git -C $breezeSource remote add origin https://github.com/KDE/breeze-icons.git
          git -C $breezeSource fetch --depth 1 origin $breezeVersion
          git -C $breezeSource checkout --detach FETCH_HEAD

          git clone --branch v6.23.0 --depth 1 https://github.com/KDE/kirigami.git $kirigamiSource
          git -C $kirigamiSource config user.name "Subsurface CI"
          git -C $kirigamiSource config user.email "ci@subsurface-divelog.org"
          Get-ChildItem (Join-Path $thirdParty "00*.patch") | Sort-Object Name | ForEach-Object {
            git -C $kirigamiSource am $_.FullName
          }
          cmake -S $kirigamiSource -B $kirigamiBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_INSTALL_PREFIX="$installPrefix" `
            -DECM_DIR="$installPrefix\share\ECM\cmake" `
            -DUSE_DBUS=OFF `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;$installPrefix"
          cmake --build $kirigamiBuild --target install

      - name: Build googlemaps plugin
        shell: pwsh
        run: |
          git clone https://github.com/Subsurface/googlemaps.git googlemaps
          Push-Location googlemaps
          git checkout qt6-upstream
          Pop-Location
          New-Item -ItemType Directory -Force -Path googlemaps/build
          Push-Location googlemaps/build
          qmake "CONFIG+=release" ../googlemaps.pro
          nmake
          nmake install
          Pop-Location

      - name: Build qlitehtml
        shell: pwsh
        run: |
          $qlitehtmlVersion = (Get-Content "scripts/get-dep-lib.sh" | Select-String 'CURRENT_QLITEHTML="(.+)"').Matches.Groups[1].Value
          git clone https://github.com/dirkhh/qlitehtml.git qlitehtml
          Push-Location qlitehtml
          git checkout -f $qlitehtmlVersion
          git submodule init
          git submodule update
          $installPrefix = "${{ github.workspace }}\install"
          cmake . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DCMAKE_INSTALL_PREFIX="$installPrefix"
          ninja
          ninja install
          Pop-Location

      - name: set the version information
        id: version_number
        uses: ./.github/actions/manage-version
        with:
          no-increment: true

      - name: Configure Subsurface
        shell: pwsh
        run: |
          $installPrefix = "${{ github.workspace }}\install"
          $buildDir = "${{ github.workspace }}\build"
          $vcpkgRoot = "C:\vcpkg"
          $vcpkgInstalled = "$vcpkgRoot\installed\x64-windows"
          New-Item -ItemType Directory -Force -Path $buildDir
          Push-Location $buildDir
          $prefixPath = @("$env:Qt6_DIR", "$installPrefix", "$vcpkgInstalled") -join ";"
          cmake "${{ github.workspace }}" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="$prefixPath" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DSUBSURFACE_VCPKG_ROOT="$vcpkgRoot" `
            -DSUBSURFACE_TARGET_EXECUTABLE=MobileExecutable `
            -DBUILD_WITH_QT6=ON `
            -DLIBDIVECOMPUTER_INCLUDE_DIR="$installPrefix\include" `
            -DLIBDIVECOMPUTER_LIBRARIES="$installPrefix\lib\libdivecomputer.lib" `
            -DLIBGIT2_INCLUDE_DIR="$vcpkgInstalled\include" `
            -DLIBGIT2_LIBRARIES="$vcpkgInstalled\lib\git2.lib" `
            -DMAKE_TESTS=OFF `
            -DNO_USERMANUAL=OFF `
            -DINSTALL_DOCS=ON
          Pop-Location

      - name: Build Subsurface
        shell: pwsh
        run: |
          Push-Location "${{ github.workspace }}\build"
          ninja
          Pop-Location

      - name: Stage portable Neo package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installPrefix = "${{ github.workspace }}\install"
          $stagingDir = "${{ github.workspace }}\build\staging"
          Push-Location "${{ github.workspace }}\build"
          ninja install
          Pop-Location

          # windeployqt copies Kirigami's runtime DLLs, but it cannot discover
          # the separately installed KDE QML module. Keep its URI-relative
          # layout so `import org.kde.kirigami` resolves from <app>/qml.
          $kirigamiQml = @(
            (Join-Path $installPrefix "qml"),
            (Join-Path $installPrefix "lib\qml")
          ) | Where-Object {
            Test-Path (Join-Path $_ "org\kde\kirigami\qmldir")
          } | Select-Object -First 1
          if (-not $kirigamiQml) {
            throw "Kirigami QML module was not found below $installPrefix"
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $stagingDir "qml") | Out-Null
          Copy-Item (Join-Path $kirigamiQml '*') -Destination (Join-Path $stagingDir "qml") -Recurse -Force

      - name: Smoke-test staged Neo application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stagingDir = "${{ github.workspace }}\build\staging"
          $neoExecutable = Join-Path $stagingDir "subsurface-mobile.exe"
          $nativeRoaming = $env:APPDATA
          $smokeProfile = Join-Path "${{ runner.temp }}" "subsurface-neo-smoke"
          $roaming = Join-Path $smokeProfile "Roaming"
          $local = Join-Path $smokeProfile "Local"
          New-Item -ItemType Directory -Force -Path (Join-Path $roaming "Subsurface"),$local | Out-Null
          $env:APPDATA = $roaming
          $env:LOCALAPPDATA = $local
          $env:SUBSURFACE_MOBILE_WIDTH = "1100"
          $env:SUBSURFACE_MOBILE_HEIGHT = "760"

          $process = Start-Process -FilePath $neoExecutable -WorkingDirectory $stagingDir -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            # Subsurface uses SHGetFolderPath, which may retain the process'
            # original roaming directory even after APPDATA is overridden.
            $errorLog = Join-Path $nativeRoaming "Subsurface\subsurface_err.log"
            if (Test-Path $errorLog) { Get-Content $errorLog }
            throw "Staged Neo application exited during launch smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Create portable Neo archive
        id: archive-name
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build"
          $stagingDir = Join-Path $buildDir "staging"
          $neoExecutable = Join-Path $stagingDir "subsurface-mobile.exe"
          if (-not (Test-Path $neoExecutable)) { throw "Neo executable was not staged: $neoExecutable" }
          $archiveName = "Subsurface-Neo-Windows-${{ steps.version_number.outputs.version }}.zip"
          Compress-Archive -Path (Join-Path $stagingDir '*') -DestinationPath (Join-Path $buildDir $archiveName) -Force
          "archive=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Publish Neo Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Subsurface-Neo-Windows-${{ steps.version_number.outputs.version }}
          path: ${{ github.workspace }}/build/${{ steps.archive-name.outputs.archive }}
          compression-level: 0
