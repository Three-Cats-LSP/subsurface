name: Android Qt 6

on:
  push:
    paths-ignore:
    - scripts/docker/**
    branches:
    - master
    - modern-ui
  pull_request:
    paths-ignore:
    - scripts/docker/**
    branches:
    - master
    - modern-ui
  workflow_dispatch:

env:
  RELEASE_PUBLISHER: "true"

permissions: read-all

jobs:
  build:
    outputs:
      release_tag: v${{ steps.version_number.outputs.version }}
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/../subsurface.keystore
      QT_ARCH: 'android_arm64_v8a'
      ANDROID_BUILD_ABI: 'arm64-v8a'
      BUILDROOT: '/android'
    runs-on: ubuntu-24.04
    container:
      image: subsurface/android-build:6.10.3-2

    steps:
    - name: checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: create links to sync standalone and GitHub filesystem
      run: |
        ln -s "$GITHUB_WORKSPACE" ${BUILDROOT}/src/subsurface

    - name: prepare Neo test signing key
      env:
        NEO_ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.NEO_ANDROID_TEST_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$NEO_ANDROID_TEST_KEYSTORE_BASE64" ]; then
          printf '%s' "$NEO_ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore
        fi

    - name: set the version information
      id: version_number
      uses: ./.github/actions/manage-version
      with:
        no-increment: true

    - name: build Subsurface-mobile
      env:
        BUILDNR: ${{ steps.version_number.outputs.buildnr }}
        VERSION: ${{ steps.version_number.outputs.version }}
        VERSION_4: ${{ steps.version_number.outputs.version_4 }}
        BUILD_TYPE: debug

        NEO_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.NEO_ANDROID_TEST_KEYSTORE_PASSWORD }}
      run: |
        # Keep development APKs installable while giving Android OAuth a stable
        # certificate identity. The key itself remains a repository secret.
        if [ -n "$NEO_ANDROID_TEST_KEYSTORE_PASSWORD" ]; then
          export KS_PASS="$NEO_ANDROID_TEST_KEYSTORE_PASSWORD"
          export KS_ALIAS=neo-test
        fi
        mkdir -p build-android
        ln -s $(pwd)/build-android ${BUILDROOT}/build-android
        bash -x ${GITHUB_WORKSPACE}/packaging/android/in-container-build.sh
        find /android/build-android/android-build/ -name "*.apk"

    - name: collect APK
      env:
        VERSION: ${{ steps.version_number.outputs.version }}
      run: |
        APK="/android/output/Subsurface-mobile-${VERSION}.apk"
        test -f "${APK}"
        cp "${APK}" "${GITHUB_WORKSPACE}/Subsurface-Modern-Android-${VERSION}.apk"

    - name: publish development APK
      uses: actions/upload-artifact@v7
      with:
        name: Subsurface-Modern-Android-${{ steps.version_number.outputs.version }}
        path: Subsurface-Modern-Android-*.apk
