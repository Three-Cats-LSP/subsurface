name: Neo Windows history protocol

on:
  workflow_call:
    inputs:
      test_functions:
        type: string
        required: false
        default: ''

permissions: read-all

jobs:
  history-protocol:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt protocol test dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8'
          arch: win64_msvc2022_64
          cache: true
      - name: Build and test history protocol on Windows
        env:
          NEO_HISTORY_TEST_FUNCTIONS: ${{ inputs.test_functions }}
        shell: pwsh
        run: |
          cmake -S tests/cloud-history -B build-history -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" "-DNEO_HISTORY_TEST_FUNCTIONS=$env:NEO_HISTORY_TEST_FUNCTIONS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-history --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-history --build-config Release --output-on-failure
          $historyTestExit = $LASTEXITCODE
          if (Test-Path build-history/history-results.txt) { Get-Content build-history/history-results.txt }
          exit $historyTestExit
      - name: Stage isolated native identity probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-history/identity-probe | Out-Null
          Copy-Item build-history/Release/NeoCloudIdentityProbe.exe build-history/identity-probe/
          windeployqt --no-translations --dir build-history/identity-probe build-history/identity-probe/NeoCloudIdentityProbe.exe
          exit $LASTEXITCODE
      - name: Preserve native identity probe
        uses: actions/upload-artifact@v7
        with:
          name: Neo-Windows-cloud-identity-probe${{ inputs.test_functions && '-focused' || '' }}
          path: build-history/identity-probe/
          if-no-files-found: error
      - name: Preserve protocol test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Neo-Windows-history-protocol-evidence
          path: |
            build-history/Testing/Temporary/*.log
            build-history/history-results.txt
          if-no-files-found: ignore
