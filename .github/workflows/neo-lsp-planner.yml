name: Neo LSP planner adoption

on:
  workflow_dispatch:
  push:
    branches: [modern-ui]
    paths:
      - '.github/workflows/neo-lsp-planner.yml'
      - 'third-party/lsp-planner/**'
      - 'tools/lsp-planner/**'
      - 'qt-models/lspplanner*'
      - 'tests/testlspplanner.*'
      - 'tests/lsp-planner/**'
      - 'tests/data/neo-lsp-regression.json'
      - 'tests/data/lsp-planner/**'

permissions: read-all

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lsp-planner/package-lock.json
      - run: npm ci --prefix tools/lsp-planner
      - run: node tools/lsp-planner/build-runtime.cjs --check
      - run: node tools/lsp-planner/capture-reference.cjs --check
  native:
    needs: source-parity
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install host Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      - name: Install Windows Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: neo-lsp-complete-qt-v1
      - name: Verify complete Windows Qt runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($relative in @('bin/Qt6Core.dll', 'bin/Qt6Network.dll', 'bin/Qt6Qml.dll', 'bin/Qt6Test.dll', 'plugins/platforms/qwindows.dll')) {
            $dependency = Join-Path $env:QT_ROOT_DIR $relative
            if (-not (Test-Path -LiteralPath $dependency)) { throw "Incomplete Qt runtime: $dependency" }
          }
      - name: Configure native LSP regression
        run: cmake -S tests/lsp-planner -B build-lsp
      - name: Build native LSP regression
        run: cmake --build build-lsp --config Release --parallel 2
      - name: Deploy Windows test runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # QCoreApplication + QJSEngine: no GUI, QML imports, network
          # operations or plugins. Deploy its complete four-library closure
          # explicitly, avoiding GUI debug-plugin discovery by windeployqt.
          foreach ($library in @('Qt6Core.dll', 'Qt6Network.dll', 'Qt6Qml.dll', 'Qt6Test.dll')) {
            Copy-Item -LiteralPath (Join-Path $env:QT_ROOT_DIR "bin/$library") -Destination build-lsp/Release/
          }
      - name: Compare native engine with pinned upstream results
        if: runner.os != 'Windows'
        run: ctest --test-dir build-lsp --build-config Release --output-on-failure --verbose
      - name: Compare Windows engine and preserve startup failures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build-lsp --build-config Release --output-on-failure --verbose
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            & build-lsp/Release/TestLspPlanner.exe -o build-lsp/windows-direct-results.txt,txt
            Write-Output "Direct native test exit code: $LASTEXITCODE"
            if (Test-Path build-lsp/windows-direct-results.txt) { Get-Content build-lsp/windows-direct-results.txt }
          }
          exit $testExit
      - name: Retain native comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Neo-LSP-native-${{ runner.os }}
          path: |
            build-lsp/Testing/Temporary/*.log
            build-lsp/windows-direct-results.txt
