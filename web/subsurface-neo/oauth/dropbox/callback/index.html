<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Return to Subsurface Neo</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #f7fafc; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 40px)); padding: 32px; border: 1px solid #24344d; border-radius: 18px; background: #111b2e; }
    h1 { margin-top: 0; }
    p { color: #a9b6c8; }
    a { color: #44c7f4; }
  </style>
</head>
<body>
  <main>
    <h1>Returning to Subsurface Neo…</h1>
    <p>If the app does not open automatically, use the link below.</p>
    <p><a id="open-app" href="#">Open Subsurface Neo</a></p>
  </main>
  <script>
    const target = 'subsurface-neo://oauth/callback' + window.location.search;
    const link = document.getElementById('open-app');
    link.href = target;
    window.location.replace(target);
  </script>
</body>
</html>
